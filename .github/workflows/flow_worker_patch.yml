name: V11.6 Flow runtime sanity check

on:
  push:
    branches: [fix/creative-studio-v7]
    paths:
      - ".github/workflows/flow_worker_patch.yml"
      - "hungcoi.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creative-studio-v7
          fetch-depth: 1

      - name: Verify canonical Flow runtime
        shell: python
        run: |
          from pathlib import Path
          import ast

          p = Path("hungcoi.py")
          s = p.read_text(encoding="utf-8")

          required = [
              "def _playwright_runtime_candidates():",
              "def _playwright_prepare_runtime():",
              "def _flow_thread_context(self, account_id):",
              "def _flow_click_generate_image(page, prompt_box=None, before_img_count=0):",
              "_flow_click_generate_image(page, box, before_img_count)",
              'count=max(1, int(os.getenv("VHUNG_CREATIVE_FLOW_WORKERS","1") or 1))',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing V11.6 Flow runtime markers: " + repr(missing))

          # Syntax validation only. Do not mutate production code from CI.
          ast.parse(s, filename="hungcoi.py")
          print("V11.6 FLOW RUNTIME SANITY OK")
