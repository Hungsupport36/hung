name: V11.6.4 Repair Creative Studio verify recursion

on:
  push:
    branches: [fix/creative-studio-v7]
    paths:
      - ".github/workflows/flow_worker_patch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creative-studio-v7
          fetch-depth: 1

      - name: Repair recursive Flow profile verify wrappers
        shell: python
        run: |
          from pathlib import Path
          import ast
          import textwrap

          p = Path("hungcoi.py")
          s = p.read_text(encoding="utf-8")

          tree = ast.parse(s, filename="hungcoi.py")
          lines = s.splitlines(keepends=True)

          # Keep the FIRST real async implementation. The broken patch created
          # duplicate *_impl definitions whose bodies call themselves forever.
          impl_nodes = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.AsyncFunctionDef)
              and n.name == "_creative_flow_manual_profile_verify_async_impl"
          ]
          if not impl_nodes:
              raise SystemExit("Real async Flow profile verify implementation not found")
          impl_node = sorted(impl_nodes, key=lambda n: n.lineno)[0]
          impl_source = "".join(lines[impl_node.lineno-1:impl_node.end_lineno])

          marker = "def _creative_account_pool_html("
          marker_i = s.find(marker)
          if marker_i < 0:
              raise SystemExit("Creative account pool marker not found")

          # Preserve everything before the first real implementation, then
          # replace ALL duplicated/corrupt wrappers up to account-pool HTML.
          impl_start = s.find("async def _creative_flow_manual_profile_verify_async_impl")
          if impl_start < 0 or impl_start >= marker_i:
              raise SystemExit("Flow verify implementation boundary invalid")

          clean = textwrap.dedent(r'''
          async def _creative_flow_manual_profile_verify_async(*args, **kwargs):
              _result = await _creative_flow_manual_profile_verify_async_impl(*args, **kwargs)
              try:
                  import inspect as _inspect
                  _sig = _inspect.signature(_creative_flow_manual_profile_verify_async_impl)
                  _bound = _sig.bind_partial(*args, **kwargs)
                  _account_id = (
                      _bound.arguments.get("account_id")
                      or _bound.arguments.get("account")
                      or _bound.arguments.get("account_name")
                  )
                  _profile = (
                      _bound.arguments.get("profile")
                      or _bound.arguments.get("profile_path")
                      or _bound.arguments.get("session_profile")
                  )
                  _worker = _bound.arguments.get("worker_id")
                  _ok = bool(_result)
                  if isinstance(_result, dict):
                      _ok = bool(_result.get("ok") or _result.get("verified") or _result.get("success"))
                      _account_id = _account_id or _result.get("account_id")
                      _profile = _profile or _result.get("profile_path")
                      _worker = _worker or _result.get("worker_id")
                  elif isinstance(_result, (tuple, list)):
                      _ok = bool(_result[0]) if _result else False
                  if _ok:
                      _creative_activate_verified_flow_account(
                          account_id=_account_id,
                          profile_path=_profile,
                          worker_id=_worker,
                      )
              except Exception as _exc:
                  try:
                      workflow_cmd_log(
                          "FLOW",
                          "PROFILE_VERIFY_WRAPPER_ERROR",
                          error=str(_exc)[:500],
                      )
                  except Exception:
                      pass
              return _result

          async def _creative_flow_manual_profile_verify_impl(account_id):
              """Stable UI-facing implementation; delegates to the real async verifier."""
              return await _creative_flow_manual_profile_verify_async(account_id)

          async def _creative_flow_manual_profile_verify(*args, **kwargs):
              _result = await _creative_flow_manual_profile_verify_impl(*args, **kwargs)
              try:
                  import inspect as _inspect
                  _sig = _inspect.signature(_creative_flow_manual_profile_verify_impl)
                  _bound = _sig.bind_partial(*args, **kwargs)
                  _account_id = (
                      _bound.arguments.get("account_id")
                      or _bound.arguments.get("account")
                      or _bound.arguments.get("account_name")
                  )
                  _profile = (
                      _bound.arguments.get("profile")
                      or _bound.arguments.get("profile_path")
                      or _bound.arguments.get("session_profile")
                  )
                  _worker = _bound.arguments.get("worker_id")
                  _ok = bool(_result)
                  if isinstance(_result, dict):
                      _ok = bool(_result.get("ok") or _result.get("verified") or _result.get("success"))
                      _account_id = _account_id or _result.get("account_id")
                      _profile = _profile or _result.get("profile_path")
                      _worker = _worker or _result.get("worker_id")
                  elif isinstance(_result, (tuple, list)):
                      _ok = bool(_result[0]) if _result else False
                  if _ok:
                      _creative_activate_verified_flow_account(
                          account_id=_account_id,
                          profile_path=_profile,
                          worker_id=_worker,
                      )
              except Exception as _exc:
                  try:
                      workflow_cmd_log(
                          "FLOW",
                          "PROFILE_VERIFY_WRAPPER_ERROR",
                          error=str(_exc)[:500],
                      )
                  except Exception:
                      pass
              return _result

          ''').lstrip()

          prefix = s[:impl_start]
          suffix = s[marker_i:]
          s = prefix + impl_source + "\n\n" + clean + suffix

          ast.parse(s, filename="hungcoi.py")

          # Hard safety checks: no recursive self-call remains in either wrapper.
          for name in (
              "_creative_flow_manual_profile_verify_async",
              "_creative_flow_manual_profile_verify_impl",
              "_creative_flow_manual_profile_verify",
          ):
              nodes = [
                  n for n in ast.walk(ast.parse(s, filename="hungcoi.py"))
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name
              ]
              if len(nodes) != 1:
                  raise SystemExit(f"{name}: expected exactly 1 definition, found {len(nodes)}")
          if "_result = await _creative_flow_manual_profile_verify_impl(*args, **kwargs) if True else _creative_flow_manual_profile_verify_impl(*args, **kwargs)" in s:
              raise SystemExit("Recursive wrapper pattern still present")

          p.write_text(s, encoding="utf-8")
          print("V11.6.4: Creative Studio Flow profile verify recursion repaired")

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hungcoi.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "V11.6.4: repair Flow profile verify recursion"
          git push origin HEAD:fix/creative-studio-v7
