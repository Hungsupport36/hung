name: V11.5.3 Flow worker patch

on:
  push:
    branches: [fix/creative-studio-v7]
    paths:
      - ".github/workflows/flow_worker_patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/creative-studio-v7
          fetch-depth: 1

      - name: Patch Flow Generate control
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("hungcoi.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("def _flow_click_generate_image(page):")
          end = s.index("\ndef _flow_download_latest_asset(", start)

          new = r'''def _flow_click_generate_image(page):
    """Submit the real Flow composer without depending on one aria-label."""
    generate_re = re.compile(
        r"generate|create\s*(image|images|video|videos)?|submit|run|tạo\s*(ảnh|hình)?",
        re.I,
    )
    bad_re = re.compile(
        r"cancel|close|attach|upload|add|settings|menu|more|delete|download|share|help",
        re.I,
    )

    def _label(node):
        vals = []
        for name in (
            "aria-label", "title", "data-testid", "data-test-id",
            "data-tooltip", "data-tooltip-content", "name",
        ):
            try:
                v = node.get_attribute(name)
                if v:
                    vals.append(str(v))
            except Exception:
                pass
        try:
            vals.append(node.inner_text(timeout=250) or "")
        except Exception:
            pass
        return " ".join(vals).strip()

    # 1) Resolve the visible Generate/Create control by accessible metadata.
    for selector in (
        "button", "[role='button']", "[aria-label]", "[title]",
        "[data-testid]", "[data-tooltip]",
    ):
        try:
            loc = page.locator(selector)
            for i in range(loc.count() - 1, -1, -1):
                b = loc.nth(i)
                if not b.is_visible() or not b.is_enabled():
                    continue
                label = _label(b)
                if generate_re.search(label) and not bad_re.search(label):
                    b.scroll_into_view_if_needed()
                    b.click(timeout=5000)
                    return True
        except Exception:
            continue

    # 2) Old Creative Studio fallback: submit from the focused Flow composer.
    #    One Ctrl+Enter attempt, then one Enter attempt; never spam keys.
    try:
        boxes = page.locator(
            "textarea, [contenteditable='true'], [role='textbox'], input[type='text']"
        )
        box = None
        for i in range(boxes.count() - 1, -1, -1):
            x = boxes.nth(i)
            if x.is_visible() and x.is_enabled():
                box = x
                break
        if box is not None:
            box.click(timeout=3000)
            try:
                box.press("Control+Enter")
                time.sleep(1.0)
                return True
            except Exception:
                pass
            try:
                box.press("Enter")
                time.sleep(1.0)
                return True
            except Exception:
                pass
    except Exception:
        pass

    return False
'''

          s = s[:start] + new + s[end:]
          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hungcoi.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "V11.5.3: use real Flow composer submission fallback"
          git push origin HEAD:fix/creative-studio-v7
